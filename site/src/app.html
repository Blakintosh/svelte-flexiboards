<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="theme-color" content="#F7F7F4" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0C1620" media="(prefers-color-scheme: dark)" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Domine:wght@400..700&family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body data-sveltekit-preload-data="hover" class="flex min-h-screen flex-col overscroll-none">
		<div style="display: contents">
			<div data-vaul-drawer-wrapper class="bg-background flex min-h-0 flex-1 flex-col">
				%sveltekit.body%
			</div>
		</div>
	</body>
</html>
