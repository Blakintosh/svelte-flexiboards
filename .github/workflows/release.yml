name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  validate:
    name: Release checks
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    name: Version or stage packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install npm with staged publishing support
        run: npm install --global npm@11.19.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' build
      - run: pnpm check:artifacts
      - name: Create or update the version PR
        uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack unpublished versions
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm changeset pack --out-dir "$RUNNER_TEMP/flexiboards-release"
      - name: Stage packages for maintainer approval
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm release:stage "$RUNNER_TEMP/flexiboards-release"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Save release candidates
        if: always() && steps.changesets.outputs.hasChangesets == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-candidates
          path: ${{ runner.temp }}/flexiboards-release
          retention-days: 14
