name: CI

on:
  push:
    branches: [main, react]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The adapters and the site consume the built packages.
      - run: pnpm -C packages/core build
      - run: pnpm -C packages/testing build
      - run: pnpm -C packages/svelte build
      - run: pnpm -C packages/react build

      - name: Unit and component tests
        run: pnpm -r test

      - name: React adapter types and lint
        run: pnpm -C packages/react check && pnpm -C packages/react lint

      - name: Svelte adapter check
        run: pnpm -C packages/svelte check

      - name: Site check (includes generated API tables and Markdown docs)
        run: pnpm -C site extract-api && pnpm -C site check

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/core build && pnpm -C packages/testing build && pnpm -C packages/svelte build && pnpm -C packages/react build
      - run: pnpm -C site exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm -C site e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 7
